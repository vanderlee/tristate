name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.2.3)
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          node -e "const packageVersion = require('./package.json').version; const releaseVersion = process.env.EXPECTED_VERSION.replace(/^v/, ''); if (packageVersion !== releaseVersion) { console.error('package.json version ' + packageVersion + ' does not match release version ' + releaseVersion); process.exit(1); }"

      - name: Install dependencies
        run: npm install

      - name: Add QUnit compatibility shim
        run: |
          printf '%s\n' \
            "var util = require('util');" \
            "util.print = function () { process.stdout.write(Array.prototype.join.call(arguments, '')); };" \
            > /tmp/qunit-compat.js

      - name: Run tests
        run: npm test
        env:
          NODE_OPTIONS: --require=/tmp/qunit-compat.js

      - name: Publish package
        run: npm publish
